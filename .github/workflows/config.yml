name: API tests

on: workflow_dispatch
#  push:
#    branches:
#      - main
#  pull_request:
#    branches:
#      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Docker container with app
        run: |
          # Запускаем контейнер с именем api_test_container (можно выбрать любое)
          docker run -d --name api_test_container -p 56733:80 litovsky/flask-api-test

          # Проверяем, что приложение запустилось и доступно
          for i in {1..10}; do
            if curl -s http://localhost:56733/health; then
              echo "App is ready!"
              break
            fi
            echo "Waiting for app to be ready..."
            sleep 2
          done

      - name: Run API tests with pytest and generate Allure results
        run: |
          pytest --alluredir=allure-results --numprocesses 4 --reruns 1 -v
        env:
          HTTP_CLIENT.URL: ${{secrets.HTTP_CLIENT.URL}}
          HTTP_CLIENT.TIMEOUT: ${{secrets.HTTP_CLIENT.TIMEOUT}}

      - name: Stop Docker container
        if: always()
        run: |
          docker stop api_test_container
          docker rm api_test_container

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Allure Report action from marketplace
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
